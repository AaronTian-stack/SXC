name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        shell: pwsh
        run: ./format-all.ps1 -Check

  build:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-debug
            config: Debug
            artifact: sxc-sdk-windows-debug
          - os: windows-latest
            preset: windows-release
            config: Release
            artifact: sxc-sdk-windows-release
          - os: ubuntu-24.04
            preset: linux-debug
            config: Debug
            artifact: sxc-sdk-linux-debug
          - os: ubuntu-24.04
            preset: linux-release
            config: Release
            artifact: sxc-sdk-linux-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2'
      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --target SXC --parallel
      - name: Package SDK
        run: cmake --install build --config ${{ matrix.config }} --prefix sdk
      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sdk/
